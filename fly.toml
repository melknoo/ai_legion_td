# Fly.io: one small machine runs page and game server. Rooms live in memory, so keep a
# single machine (deploy with --ha=false); it stops when nobody is connected and wakes on the next visit.
app = 'legion-pixel'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
