# Self-hosting on an always-on Linux box behind CGNAT (e.g. Starlink) via a Cloudflare Tunnel.
# cloudflared only dials out, so no port is opened on the router or the host.
#   cp deploy/home/.env.example deploy/home/.env   # paste the tunnel token
#   docker compose -f deploy/home/compose.yml up -d --build
name: legion

services:
  legion:
    build: ../..
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m
    # Finished games for /stats survive restarts and deploys.
    volumes:
      - legion-data:/data
    environment:
      STATS_FILE: /data/games.jsonl
      # Password for https://legion.schleiweb.de/stats; empty keeps the page off.
      STATS_TOKEN: ${STATS_TOKEN:-}
    # JSON log lines (games, client errors); capped so they can't fill the disk.
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    networks: [tunnel]
    # Only for checking on the host itself; not reachable from the LAN.
    ports:
      - 127.0.0.1:8080:8080

  cloudflared:
    image: cloudflare/cloudflared:2026.1.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/home/.env}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    depends_on: [legion]
    networks: [tunnel]

networks:
  tunnel: {}

volumes:
  legion-data: {}
